<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filter Explorer</title>
<style>
:root {
  --bg: #f6f5f1;
  --surface: #ffffff;
  --text: #1f1e1b;
  --muted: #6b6860;
  --border: #dedbd2;
  --grid: #ebe8e0;
  --grid-strong: #cfcbc0;
  --wire: #2d2b27;
  --accent: #c2512f;
  --input: #3b6ea8;
  --rc: #3b8f6e;
  --rl: #8a5bb8;
  --band: rgba(194, 81, 47, 0.10);
  --btn-on-bg: #1f1e1b;
  --btn-on-text: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a1918; --surface: #242321; --text: #ecebe6; --muted: #a3a097;
    --border: #3a3834; --grid: #2f2d2a; --grid-strong: #48453f; --wire: #e2e0d9;
    --accent: #ee8a63; --input: #7fa9dc; --rc: #6cc39f; --rl: #b994e0;
    --band: rgba(238, 138, 99, 0.13); --btn-on-bg: #ecebe6; --btn-on-text: #1a1918;
  }
}
:root[data-theme="dark"] {
  --bg: #1a1918; --surface: #242321; --text: #ecebe6; --muted: #a3a097;
  --border: #3a3834; --grid: #2f2d2a; --grid-strong: #48453f; --wire: #e2e0d9;
  --accent: #ee8a63; --input: #7fa9dc; --rc: #6cc39f; --rl: #b994e0;
  --band: rgba(238, 138, 99, 0.13); --btn-on-bg: #ecebe6; --btn-on-text: #1a1918;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.3 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: grid; grid-template-rows: auto 1fr; gap: 6px; padding: 6px;
  height: 100vh; overflow: hidden;
}
/* top bar */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; }
.modes { display: flex; gap: 4px; }
.modes button, .tog {
  font: inherit; font-weight: 600; padding: 5px 12px; border-radius: 7px;
  border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer;
}
.modes button[aria-pressed="true"], .tog[aria-pressed="true"] { background: var(--btn-on-bg); color: var(--btn-on-text); border-color: var(--btn-on-bg); }
.sl { display: flex; align-items: center; gap: 6px; }
.sl[hidden] { display: none; }
.sl b { min-width: 1.2em; }
.sl output { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--accent); min-width: 5.2em; }
.sl input { width: clamp(90px, 11vw, 190px); accent-color: var(--accent); margin: 0; }
.tog[hidden] { display: none; }
/* panels */
.main {
  display: grid; gap: 6px; min-height: 0;
  grid-template-columns: minmax(0, 0.85fr) minmax(0, 2fr);
  grid-template-rows: minmax(0, 1.5fr) minmax(0, 1fr);
  grid-template-areas: "sch bode" "read time";
}
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; min-height: 0; min-width: 0; overflow: hidden; position: relative; }
.panel svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#p-sch { grid-area: sch; } #p-bode { grid-area: bode; } #p-time { grid-area: time; }
#p-read { grid-area: read; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 6px; align-content: stretch; }
#p-read div { background: var(--bg); border-radius: 7px; padding: 4px 8px; display: flex; flex-direction: column; justify-content: center; min-height: 0; }
#p-read span { font-size: 0.8rem; color: var(--muted); }
#p-read b { font-variant-numeric: tabular-nums; font-size: clamp(1rem, 2.2vh, 1.6rem); }
@media (max-width: 700px) {
  body { height: auto; overflow: auto; }
  .main { grid-template-columns: 1fr; grid-template-rows: 220px 300px 200px auto; grid-template-areas: "sch" "bode" "time" "read"; }
}
</style>
</head>
<body>
<div class="bar">
  <div class="modes" role="group" aria-label="Circuit">
    <button data-mode="rr">R–R</button>
    <button data-mode="rc">R–C</button>
    <button data-mode="rl">R–L</button>
    <button data-mode="lc">R–L∥C</button>
  </div>
  <label class="sl" id="c-f"><b>f</b><input type="range" id="s-f" min="0" max="1000" aria-label="Frequency"><output id="o-f"></output></label>
  <label class="sl" id="c-L"><b>L</b><input type="range" id="s-L" min="0" max="1000" aria-label="Inductance"><output id="o-L"></output></label>
  <label class="sl" id="c-C"><b>C</b><input type="range" id="s-C" min="0" max="1000" aria-label="Capacitance"><output id="o-C"></output></label>
  <button class="tog" id="ov" aria-pressed="true" title="Overlay the R–C and R–L curves">+ R–C, R–L</button>
</div>

<div class="main">
  <div class="panel" id="p-sch"><svg id="schem" viewBox="0 0 400 215" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Schematic"></svg></div>
  <div class="panel" id="p-bode"><svg id="bode" role="img" aria-label="Gain versus frequency"></svg></div>
  <div class="panel" id="p-read"></div>
  <div class="panel" id="p-time"><svg id="time" role="img" aria-label="Input and output waveforms"></svg></div>
</div>

<script>
(() => {
  const S = { mode: "lc", R: 1000, R2: 1000, L: 846e-6, C: 42.5e-9, f: 26500, overlay: true };
  // Resistors are fixed at 1 kOhm (series R and the R-R divider's R2).
  const RANGES = { f: [100, 1e6], L: [10e-6, 100e-3], C: [1e-9, 10e-6] };
  const FMIN = 100, FMAX = 1e6, DBTOP = 5, DBBOT = -60;

  // ---------- math ----------
  const TAU = 2 * Math.PI;
  const c = (re, im) => ({ re, im });
  const add = (a, b) => c(a.re + b.re, a.im + b.im);
  const mul = (a, b) => c(a.re * b.re - a.im * b.im, a.re * b.im + a.im * b.re);
  const div = (a, b) => { const d = b.re * b.re + b.im * b.im; return c((a.re * b.re + a.im * b.im) / d, (a.im * b.re - a.re * b.im) / d); };
  const mag = a => Math.hypot(a.re, a.im);
  function shunt(mode, f, p) {
    const w = TAU * f;
    if (mode === "rr") return c(p.R2, 0);
    if (mode === "rc") return c(0, -1 / (w * p.C));
    if (mode === "rl") return c(0, w * p.L);
    const zl = c(0, w * p.L), zc = c(0, -1 / (w * p.C)), den = add(zl, zc);
    if (Math.abs(den.im) < 1e-12) return c(1e18, 0);
    return div(mul(zl, zc), den);
  }
  const H = (mode, f, p) => { const z = shunt(mode, f, p); return div(z, add(c(p.R, 0), z)); };
  const dB = h => 20 * Math.log10(Math.max(mag(h), 1e-9));
  function keyFreqs(mode, p) {
    if (mode === "rc") return { fc: 1 / (TAU * p.R * p.C) };
    if (mode === "rl") return { fc: p.R / (TAU * p.L) };
    if (mode === "lc") {
      const f0 = 1 / (TAU * Math.sqrt(p.L * p.C)), Q = p.R / Math.sqrt(p.L / p.C), k = Math.sqrt(1 + 1 / (4 * Q * Q));
      return { f0, Q, BW: f0 / Q, flo: f0 * (k - 1 / (2 * Q)), fhi: f0 * (k + 1 / (2 * Q)) };
    }
    return {};
  }
  function eng(v, unit) {
    if (!isFinite(v)) return "∞" + unit;
    const pre = [[1e6, "M"], [1e3, "k"], [1, ""], [1e-3, "m"], [1e-6, "µ"], [1e-9, "n"]];
    for (const [s, p] of pre) if (Math.abs(v) >= s * 0.9995) {
      const x = v / s, d = Math.abs(x) >= 100 ? 0 : Math.abs(x) >= 10 ? 1 : 2;
      return x.toFixed(d) + " " + p + unit;
    }
    return v.toExponential(1) + " " + unit;
  }
  const toT = (v, [a, b]) => Math.round(1000 * Math.log(v / a) / Math.log(b / a));
  const fromT = (t, [a, b]) => a * Math.pow(b / a, t / 1000);

  // ---------- svg helpers ----------
  const NS = "http://www.w3.org/2000/svg";
  function el(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function txt(parent, x, y, s, o = {}) {
    const t = el("text", { x, y, fill: o.fill || "var(--text)", "font-size": o.size || 13, "text-anchor": o.anchor || "start", "font-weight": o.weight || 400, "font-family": "inherit" }, parent);
    t.textContent = s; return t;
  }
  const W = { fill: "none", stroke: "var(--wire)", "stroke-width": 2.2, "stroke-linejoin": "round", "stroke-linecap": "round" };
  function size(svg) { const r = svg.getBoundingClientRect(); const w = Math.max(50, r.width), h = Math.max(50, r.height); svg.setAttribute("viewBox", `0 0 ${w} ${h}`); return [w, h]; }

  // ---------- schematic ----------
  function resH(g, x1, x2, y) {
    const m = (x1 + x2) / 2, hw = 28; let d = `M${x1} ${y} H${m - hw}`;
    for (let i = 0; i < 6; i++) d += ` L${m - hw + (2 * hw / 6) * (i + 0.5)} ${y + (i % 2 ? 8 : -8)}`;
    el("path", { d: d + ` L${m + hw} ${y} H${x2}`, ...W }, g);
  }
  function resV(g, x, y1, y2) {
    const m = (y1 + y2) / 2, hw = 28; let d = `M${x} ${y1} V${m - hw}`;
    for (let i = 0; i < 6; i++) d += ` L${x + (i % 2 ? 8 : -8)} ${m - hw + (2 * hw / 6) * (i + 0.5)}`;
    el("path", { d: d + ` L${x} ${m + hw} V${y2}`, ...W }, g);
  }
  function capV(g, x, y1, y2) {
    const m = (y1 + y2) / 2;
    el("path", { d: `M${x} ${y1} V${m - 6} M${x - 15} ${m - 6} H${x + 15} M${x - 15} ${m + 6} H${x + 15} M${x} ${m + 6} V${y2}`, ...W }, g);
  }
  function indV(g, x, y1, y2) {
    const m = (y1 + y2) / 2; let d = `M${x} ${y1} V${m - 30}`;
    for (let i = 0; i < 4; i++) d += " a7.5 7.5 0 0 1 0 15";
    el("path", { d: d + ` V${y2}`, ...W }, g);
  }
  function drawSchematic() {
    const svg = document.getElementById("schem"); svg.replaceChildren();
    const g = el("g", {}, svg);
    const T = 42, B = 178, M = (T + B) / 2, xs = 42, xr1 = 82, xr2 = 162, lc = S.mode === "lc";
    const xa = 215, xb = lc ? 285 : 215, xo = 362;
    el("circle", { cx: xs, cy: M, r: 18, ...W }, g);
    el("path", { d: `M${xs - 9} ${M} q4.5 -10 9 0 t9 0`, ...W }, g);
    el("path", { d: `M${xs} ${T} V${M - 18} M${xs} ${M + 18} V${B} M${xs} ${T} H${xr1} M${xr2} ${T} H${xo} M${xs} ${B} H${xo}`, ...W }, g);
    resH(g, xr1, xr2, T);
    txt(g, (xr1 + xr2) / 2, T - 16, eng(S.R, "Ω"), { anchor: "middle", size: 14 });
    txt(g, xs, B + 26, "Vin", { anchor: "middle", fill: "var(--input)", weight: 700, size: 15 });
    if (S.mode === "rr") { resV(g, xa, T, B); txt(g, xa + 16, M + 5, eng(S.R2, "Ω"), { size: 14 }); }
    if (S.mode === "rc") { capV(g, xa, T, B); txt(g, xa + 22, M + 5, eng(S.C, "F"), { size: 14 }); }
    if (S.mode === "rl") { indV(g, xa, T, B); txt(g, xa + 22, M + 5, eng(S.L, "H"), { size: 14 }); }
    if (lc) {
      indV(g, xa, T, B); txt(g, xa - 8, M + 5, eng(S.L, "H"), { anchor: "end", size: 14 });
      capV(g, xb, T, B); txt(g, xb + 22, M + 5, eng(S.C, "F"), { size: 14 });
      for (const y of [T, B]) el("circle", { cx: xb, cy: y, r: 3.5, fill: "var(--wire)" }, g);
    }
    for (const y of [T, B]) el("circle", { cx: xa, cy: y, r: 3.5, fill: "var(--wire)" }, g);
    for (const y of [T, B]) el("circle", { cx: xo, cy: y, r: 5, fill: "var(--surface)", stroke: "var(--accent)", "stroke-width": 2.2 }, g);
    txt(g, xo, B + 26, "Vout", { anchor: "middle", fill: "var(--accent)", weight: 700, size: 15 });
  }

  // ---------- frequency response ----------
  let bodeGeom = null;
  function drawBode() {
    const svg = document.getElementById("bode"); svg.replaceChildren();
    const [w, h] = size(svg);
    const x0 = 40, x1 = w - 10, y0 = 10, y1 = h - 22;
    const lf0 = Math.log10(FMIN), lf1 = Math.log10(FMAX);
    const fx = f => x0 + (Math.log10(f) - lf0) / (lf1 - lf0) * (x1 - x0);
    const dy = d => y0 + (DBTOP - Math.min(DBTOP, Math.max(DBBOT, d))) / (DBTOP - DBBOT) * (y1 - y0);
    bodeGeom = { x0, x1, xf: x => Math.pow(10, lf0 + (x - x0) / (x1 - x0) * (lf1 - lf0)) };
    const g = el("g", {}, svg);
    const k = keyFreqs(S.mode, S);

    if (S.mode === "lc") {
      const a = fx(Math.max(FMIN, k.flo)), b = fx(Math.min(FMAX, k.fhi));
      if (b > a) el("rect", { x: a, y: y0, width: b - a, height: y1 - y0, fill: "var(--band)" }, g);
    }
    for (let d = 0; d >= DBBOT; d -= 10) {
      el("line", { x1: x0, x2: x1, y1: dy(d), y2: dy(d), stroke: d === 0 ? "var(--grid-strong)" : "var(--grid)" }, g);
      txt(g, x0 - 6, dy(d) + 4, d, { anchor: "end", fill: "var(--muted)", size: 11 });
    }
    for (let dec = 2; dec <= 6; dec++) {
      for (let m = 1; m < 10; m++) {
        const f = m * 10 ** dec; if (f > FMAX) break;
        el("line", { x1: fx(f), x2: fx(f), y1: y0, y2: y1, stroke: m === 1 ? "var(--grid-strong)" : "var(--grid)" }, g);
      }
      txt(g, fx(10 ** dec), y1 + 16, eng(10 ** dec, "Hz").replace(" ", ""), { anchor: dec === 6 ? "end" : "middle", fill: "var(--muted)", size: 11 });
    }
    const ref = S.mode === "rr" ? dB(H("rr", 1e3, S)) - 3 : -3;
    el("line", { x1: x0, x2: x1, y1: dy(ref), y2: dy(ref), stroke: "var(--muted)", "stroke-dasharray": "2 4" }, g);

    const path = mode => {
      let d = ""; const N = Math.round(x1 - x0);
      for (let i = 0; i <= N; i++) { const f = FMIN * (FMAX / FMIN) ** (i / N); d += (i ? "L" : "M") + fx(f).toFixed(1) + " " + dy(dB(H(mode, f, S))).toFixed(1); }
      return d;
    };
    if (S.overlay && S.mode === "lc") {
      el("path", { d: path("rc"), fill: "none", stroke: "var(--rc)", "stroke-width": 2.5, "stroke-dasharray": "8 6" }, g);
      el("path", { d: path("rl"), fill: "none", stroke: "var(--rl)", "stroke-width": 2.5, "stroke-dasharray": "8 6" }, g);
      txt(g, x0 + 8, dy(dB(H("rc", FMIN, S))) + 18, "R–C", { fill: "var(--rc)", weight: 700 });
      txt(g, x1 - 8, dy(dB(H("rl", FMAX, S))) + 18, "R–L", { fill: "var(--rl)", weight: 700, anchor: "end" });
    }
    el("path", { d: path(S.mode), fill: "none", stroke: "var(--accent)", "stroke-width": 3.5, "stroke-linejoin": "round" }, g);
    const kf = k.f0 || k.fc;
    if (kf && kf >= FMIN && kf <= FMAX) el("line", { x1: fx(kf), x2: fx(kf), y1: y0, y2: y1, stroke: "var(--muted)", "stroke-dasharray": "5 4" }, g);

    const hh = H(S.mode, S.f, S), x = fx(S.f);
    el("line", { x1: x, x2: x, y1: y0, y2: y1, stroke: "var(--text)", "stroke-width": 1.5, opacity: 0.5 }, g);
    el("circle", { cx: x, cy: dy(dB(hh)), r: 7, fill: "var(--accent)", stroke: "var(--surface)", "stroke-width": 2.5 }, g);

    const hit = el("rect", { x: x0, y: y0, width: x1 - x0, height: y1 - y0, fill: "transparent", style: "cursor:crosshair;touch-action:none" }, svg);
    const pick = e => {
      const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
      const p = pt.matrixTransform(svg.getScreenCTM().inverse());
      S.f = Math.min(FMAX, Math.max(FMIN, bodeGeom.xf(Math.min(bodeGeom.x1, Math.max(bodeGeom.x0, p.x)))));
      render();
    };
    hit.addEventListener("pointerdown", e => { hit.setPointerCapture(e.pointerId); pick(e); });
    hit.addEventListener("pointermove", e => { if (e.buttons) pick(e); });
  }

  // ---------- waveforms ----------
  function drawTime() {
    const svg = document.getElementById("time"); svg.replaceChildren();
    const [w, h] = size(svg);
    const x0 = 40, x1 = w - 10, ym = h / 2, A = h / 2 - 12;
    const g = el("g", {}, svg);
    for (const v of [-1, 0, 1]) el("line", { x1: x0, x2: x1, y1: ym - v * A, y2: ym - v * A, stroke: v ? "var(--grid)" : "var(--grid-strong)" }, g);
    const hh = H(S.mode, S.f, S), m = mag(hh), ph = Math.atan2(hh.im, hh.re);
    let di = "", dout = ""; const N = Math.round(x1 - x0);
    for (let i = 0; i <= N; i++) {
      const t = i / N * 2 * TAU, x = (x0 + (x1 - x0) * i / N).toFixed(1);
      di += (i ? "L" : "M") + x + " " + (ym - A * Math.sin(t)).toFixed(1);
      dout += (i ? "L" : "M") + x + " " + (ym - A * m * Math.sin(t + ph)).toFixed(1);
    }
    el("path", { d: di, fill: "none", stroke: "var(--input)", "stroke-width": 2.5 }, g);
    el("path", { d: dout, fill: "none", stroke: "var(--accent)", "stroke-width": 3.5 }, g);
    txt(g, 6, ym - A + 12, "Vin", { fill: "var(--input)", weight: 700, size: 12 });
    txt(g, 6, ym - A + 28, "Vout", { fill: "var(--accent)", weight: 700, size: 12 });
  }

  // ---------- readouts ----------
  function drawRead() {
    const hh = H(S.mode, S.f, S), k = keyFreqs(S.mode, S), w = TAU * S.f;
    const fix = (v, d) => { const s = v.toFixed(d); return /^-0(\.0+)?$/.test(s) ? s.slice(1) : s; };
    const it = [["Gain", fix(dB(hh), 1) + " dB"], ["Phase", fix(Math.atan2(hh.im, hh.re) * 180 / Math.PI, 0) + "°"]];
    if (S.mode === "rc" || S.mode === "lc") it.push(["X<sub>C</sub>", eng(1 / (w * S.C), "Ω")]);
    if (S.mode === "rl" || S.mode === "lc") it.push(["X<sub>L</sub>", eng(w * S.L, "Ω")]);
    if (S.mode === "lc") { const z = mag(shunt("lc", S.f, S)); it.push(["|Z<sub>L∥C</sub>|", z > 1e7 ? "∞" : eng(z, "Ω")]); }
    if (S.mode === "rr") it.push(["R2/(R+R2)", (S.R2 / (S.R + S.R2)).toFixed(3)]);
    if (k.fc) it.push(["f<sub>c</sub>", eng(k.fc, "Hz")]);
    if (k.f0) it.push(["f<sub>0</sub>", eng(k.f0, "Hz")], ["Q", k.Q.toFixed(2)], ["BW", eng(k.BW, "Hz")]);
    if (it.length % 2) it.push(["", ""]);
    document.getElementById("p-read").innerHTML = it.map(([a, b]) => `<div><span>${a}</span><b>${b}</b></div>`).join("");
  }

  // ---------- controls ----------
  const keys = ["f", "L", "C"], units = { f: "Hz", L: "H", C: "F" };
  function sync() {
    for (const k of keys) {
      document.getElementById("s-" + k).value = toT(S[k], RANGES[k]);
      document.getElementById("o-" + k).textContent = eng(S[k], units[k]);
    }
    document.getElementById("c-L").hidden = !(S.mode === "rl" || S.mode === "lc");
    document.getElementById("c-C").hidden = !(S.mode === "rc" || S.mode === "lc");
    const ov = document.getElementById("ov");
    ov.hidden = S.mode !== "lc"; ov.setAttribute("aria-pressed", S.overlay);
    document.querySelectorAll(".modes button").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === S.mode));
  }
  for (const k of keys) document.getElementById("s-" + k).addEventListener("input", e => { S[k] = fromT(+e.target.value, RANGES[k]); render(); });
  document.getElementById("ov").addEventListener("click", () => { S.overlay = !S.overlay; render(); });
  document.querySelectorAll(".modes button").forEach(b => b.addEventListener("click", () => {
    S.mode = b.dataset.mode; const k = keyFreqs(S.mode, S); S.f = k.f0 || k.fc || 10000; render();
  }));

  let raf = 0;
  function render() { sync(); drawSchematic(); drawBode(); drawTime(); drawRead(); }
  new ResizeObserver(() => { cancelAnimationFrame(raf); raf = requestAnimationFrame(render); }).observe(document.querySelector(".main"));
  render();
})();
</script>
</body>
</html>
