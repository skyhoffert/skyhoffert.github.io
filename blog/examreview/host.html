<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Review · Host</title>
    <link rel="icon" href="favicon.svg">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
    <script type="module" src="js/host.js"></script>
</head>
<body class="host">
    <div class="topbar">
        <span class="title" id="set-title">Exam Review</span>
        <span>Room <span class="code" id="room-code">—</span></span>
        <span id="player-count">👥 0</span>
        <button class="ghost" id="mute" title="Mute sounds">🔊</button>
    </div>
    <main class="stage" id="stage"><p class="muted">Loading…</p></main>
    <div class="controls" id="controls"></div>
</body>
</html>
