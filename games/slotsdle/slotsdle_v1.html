<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slotsdle (v1)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c3e50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 8px;
            box-sizing: border-box;
            color: #fff;
            user-select: none;
            -webkit-user-select: none;
        }

        h1 {
            margin-top: 20px;
            margin-bottom: 0px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            font-size: 2.4rem;
            letter-spacing: 4px;
        }

        h2 {
            margin-top: 5px;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            font-size: 1.8rem;
            letter-spacing: 2px;
        }

        a, a:link, a:visited, a:hover, a:active {
            color: inherit;
        }

        .version-badge {
            font-size: 0.8rem;
            opacity: 0.6;
            margin-bottom: 5px;
            font-weight: bold;
            background: rgba(0,0,0,0.3);
            padding: 2px 8px;
            border-radius: 20px;
        }

        .tagline {
            font-size: 1rem;
            font-style: italic;
            opacity: 0.85;
            margin-bottom: 15px;
            text-align: center;
            max-width: 280px;
            line-height: 1.2;
            color: #ecf0f1;
        }

        .stats-container {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            font-size: 1.2rem;
            background: rgba(0, 0, 0, 0.28);
            text-shadow: 0 0 3px rgba(0, 0, 0, 0.7), 1px 1px 2px rgba(0, 0, 0, 0.65);
            padding: 8px 16px;
            border-radius: 10px;
        }

        .stat-box span {
            font-weight: bold;
            color: #2ecc71;
        }

        .game-wrapper {
            display: flex;
            align-items: center;
            position: relative;
            max-width: 100%;
        }

        .machine-container {
            background-color: #f1c40f;
            border: 6px solid #d35400;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            width: 320px;
            max-width: 95%;
            z-index: 2;
            box-sizing: border-box;
        }

        /* --- LEVER MECHANISM --- */
        .lever-container {
            width: 40px;
            height: 160px;
            position: relative;
            cursor: pointer;
            z-index: 1;
            margin-left: -4px;
        }

        .lever-base {
            width: 20px;
            height: 40px;
            background: #7f8c8d;
            border: 3px solid #34495e;
            border-left: none;
            position: absolute;
            top: 70px;
            left: 0;
            border-radius: 0 5px 5px 0;
        }

        .lever-arm {
            width: 12px;
            height: 80px;
            background: linear-gradient(to right, #bdc3c7, #95a5a6);
            border: 2px solid #34495e;
            position: absolute;
            bottom: 85px;
            left: 8px;
            transform-origin: bottom center;
            transition: transform 0.2s ease-in-out;
            border-radius: 4px;
        }

        .lever-knob {
            width: 30px;
            height: 30px;
            background: #e74c3c;
            border-radius: 50%;
            border: 2px solid #c0392b;
            position: absolute;
            top: -25px;
            left: -11px;
            box-shadow: inset -3px -3px 5px rgba(0,0,0,0.3);
        }

        .lever-arm.pulled {
            transform: rotateX(180deg) translateY(-50px);
        }

        .lever-container.disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .slots {
            display: flex;
            justify-content: center;
            background-color: #34495e;
            padding: 15px 10px;
            border-radius: 10px;
            border: 4px solid #2c3e50;
            margin-bottom: 20px;
        }

        .reel-wrapper {
            position: relative;
            margin: 0 5px;
            flex: 1;
            max-width: 75px;
        }

        .reel {
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: #fff;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
            cursor: default;
            transition: border 0.2s;
            box-sizing: border-box;
        }

        .reel-wrapper.selectable .reel {
            cursor: pointer;
            border: 3px dashed #f1c40f;
        }
        
        .reel-wrapper.selectable .reel:hover {
            background-color: #f5f6fa;
        }

        .lock-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(46, 204, 113, 0.4);
            border: 3px solid #2ecc71;
            border-radius: 10px;
            box-sizing: border-box;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 1px 1px 2px #000;
            pointer-events: none;
        }

        .reel-wrapper.held .lock-overlay {
            display: flex;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            width: 100%;
        }

        .player-nickname {
            margin-top: 2px;
            margin-bottom: 20px;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            color: #fffdf5;
            text-shadow: 0 0 3px rgba(0, 0, 0, 0.7), 1px 1px 2px rgba(0, 0, 0, 0.45);
            min-height: 1.2em;
            background: rgba(0, 0, 0, 0.18);
            padding: 3px 8px;
            border-radius: 999px;
            display: inline-block;
        }

        .spin-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px #c0392b;
            transition: all 0.1s ease;
            width: 100%;
            box-sizing: border-box;
        }

        .spin-btn:active:not(:disabled) {
            box-shadow: 0 1px #c0392b;
            transform: translateY(4px);
        }

        .share-btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px #27ae60;
            display: none;
            transition: all 0.1s ease;
            width: 100%;
            box-sizing: border-box;
        }

        .share-btn:active {
            box-shadow: 0 1px #27ae60;
            transform: translateY(3px);
        }

        .scoreboard-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 16px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 14px;
            box-shadow: 0 4px #2980b9;
            transition: all 0.1s ease;
            width: 100%;
            box-sizing: border-box;
        }

        .scoreboard-btn:active {
            box-shadow: 0 1px #2980b9;
            transform: translateY(3px);
        }

        .scoreboard-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.72);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
        }

        .scoreboard-overlay.active {
            display: flex;
        }

        .scoreboard-modal {
            background: #2f3e52;
            border: 3px solid #f1c40f;
            border-radius: 16px;
            width: min(560px, 100%);
            max-height: 80vh;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.35);
        }

        .scoreboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            background: #34495e;
            border-bottom: 1px solid rgba(255,255,255,0.12);
        }

        .scoreboard-title {
            font-size: 1.05rem;
            font-weight: 700;
        }

        .scoreboard-close {
            background: transparent;
            border: none;
            color: white;
            font-size: 1.8rem;
            cursor: pointer;
        }

        .scoreboard-tabs {
            display: flex;
            gap: 6px;
            padding: 10px 12px 0;
        }

        .scoreboard-tab {
            flex: 1;
            background: #51637a;
            color: white;
            border: none;
            border-radius: 8px 8px 0 0;
            padding: 8px 10px;
            font-weight: 600;
            cursor: pointer;
        }

        .scoreboard-tab.active {
            background: #f1c40f;
            color: #2c3e50;
        }

        .scoreboard-content {
            padding: 12px 14px 16px;
            max-height: calc(80vh - 120px);
            overflow: auto;
        }

        .scoreboard-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }

        .scoreboard-table th,
        .scoreboard-table td {
            padding: 8px 6px;
            border-bottom: 1px solid rgba(255,255,255,0.12);
            text-align: left;
        }

        .scoreboard-table th {
            color: #f1c40f;
            font-weight: 700;
        }

        .scoreboard-empty {
            color: #bdc3c7;
            font-style: italic;
            padding: 18px 8px;
            text-align: center;
        }

        button:disabled {
            background-color: #bdc3c7 !important;
            box-shadow: none !important;
            cursor: not-allowed;
            transform: none !important;
        }

        #message {
            margin-top: 20px;
            margin-bottom: 6px;
            font-size: 1rem;
            font-weight: bold;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.18);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.7);
            padding: 5px;
            line-height: 1.3;
        }

        /* --- RESPONSIVE MOBILE OVERRIDES --- */
        @media (max-width: 400px) {
            .game-wrapper {
                flex-direction: column;
                align-items: center;
                gap: 10px;
                width: 100%;
            }
            .lever-container {
                transform: rotate(-90deg);
                height: 100px;
                margin-left: 0;
                margin-top: -10px;
            }
            .machine-container {
                width: 100%;
            }
            .reel {
                font-size: 2.2rem;
            }
        }
    </style>

    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <h1>Slotsdle</h1>
    <div class="version-badge">v1</div>
    <div class="tagline">How many times can you spin?</div>

    <div class="game-wrapper">
        <div class="machine-container">

            <div class="stats-container">
                <div class="stat-box">Balance: <span id="balance">$50</span></div>
                <div class="stat-box">Spins: <span id="spins-count" style="color: #61afe2;">0</span></div>
            </div>

            <div class="slots">
                <div id="wrapper1" class="reel-wrapper" onclick="toggleHold(1)">
                    <div id="reel1" class="reel">🍒</div>
                    <div class="lock-overlay">HELD</div>
                </div>
                <div id="wrapper2" class="reel-wrapper" onclick="toggleHold(2)">
                    <div id="reel2" class="reel">🍋</div>
                    <div class="lock-overlay">HELD</div>
                </div>
                <div id="wrapper3" class="reel-wrapper" onclick="toggleHold(3)">
                    <div id="reel3" class="reel">🍊</div>
                    <div class="lock-overlay">HELD</div>
                </div>
            </div>

            <div id="player-nickname" class="player-nickname">...</div>

            <div class="btn-group">
                <button id="action-button" class="spin-btn" onclick="handlePrimaryAction()">SPIN ($10)</button>
                <button id="share-button" class="share-btn" onclick="copyShareHistory()">Copy Slotsdle Grid 📋</button>
            </div>

            <div id="message">Pull the lever or click spin to start!</div>
        </div>

        <div id="lever" class="lever-container" onclick="handleLeverPull()">
            <div class="lever-base"></div>
            <div id="lever-arm" class="lever-arm">
                <div class="lever-knob"></div>
            </div>
        </div>
    </div>

    <div style="height: 60px;"></div>

    <div id="scoreboard-overlay" class="scoreboard-overlay" onclick="closeScoreboard(event)">
        <div class="scoreboard-modal" onclick="event.stopPropagation()">
            <div class="scoreboard-header">
                <div class="scoreboard-title">Scores</div>
                <button class="scoreboard-close" onclick="closeScoreboard()" aria-label="Close scores">×</button>
            </div>
            <div class="scoreboard-tabs">
                <button class="scoreboard-tab active" data-tab="user" onclick="switchScoreboardTab('user')">Your Top 10</button>
                <button class="scoreboard-tab" data-tab="daily" onclick="switchScoreboardTab('daily')">Daily Top 10</button>
                <button class="scoreboard-tab" data-tab="alltime" onclick="switchScoreboardTab('alltime')">All Time Top 10</button>
            </div>
            <div id="scoreboard-content" class="scoreboard-content">
                <div id="scoreboard-user" class="scoreboard-panel"></div>
                <div id="scoreboard-daily" class="scoreboard-panel" style="display:none;"></div>
                <div id="scoreboard-alltime" class="scoreboard-panel" style="display:none;"></div>
            </div>
        </div>
    </div>

    <button id="scoreboard-btn" class="scoreboard-btn" onclick="openScoreboard()" style="margin-top: 18px; max-width: 280px;">View Scores 🏆</button>
    
    <div style="height: 50px;"></div>

    <script>
        const symbols = ['🍒', '🍋', '🍊', '💰'];
        
        let balance = 50;
        let totalSpins = 0;
        const betCost = 10;
        
        let canHold = false;
        let choiceWindowActive = false;
        let heldReels = { 1: false, 2: false, 3: false };
        let pendingPayout = 0;
        let usedRespinThisRound = false; 
        let historyGrid = [];

        let hasPlayedTodayFlag = false;

        let _force_triple = false; // For dev testing

        let uuid = null;
        let nickname = null;


        const SUPABASE_URL = 'https://shxtfuxcgkzrchvkhvgl.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_0ZE23PdJLvJyq6gfT9ORUg_mxHJGPXz';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const reel1 = document.getElementById('reel1');
        const reel2 = document.getElementById('reel2');
        const reel3 = document.getElementById('reel3');
        const actionButton = document.getElementById('action-button');
        const shareButton = document.getElementById('share-button');
        const balanceDisplay = document.getElementById('balance');
        const spinsDisplay = document.getElementById('spins-count');
        const message = document.getElementById('message');
        const lever = document.getElementById('lever');
        const leverArm = document.getElementById('lever-arm');
        const playerNicknameDisplay = document.getElementById('player-nickname');
        const scoreboardOverlay = document.getElementById('scoreboard-overlay');
        const scoreboardTabs = Array.from(document.querySelectorAll('.scoreboard-tab'));
        const scoreboardPanels = {
            user: document.getElementById('scoreboard-user'),
            daily: document.getElementById('scoreboard-daily'),
            alltime: document.getElementById('scoreboard-alltime')
        };

        let scoreboardRefreshToken = 0;
        let scoreboardDataLoaded = false;
        let scoreboardData = {
            user: [],
            daily: [],
            alltime: []
        };
        let activeScoreboardTab = 'user';

        function updateNicknameDisplay() {
            playerNicknameDisplay.textContent = nickname && nickname.trim() ? nickname : '...';
        }

        function updateUI() {
            if (hasPlayedTodayFlag) {
                actionButton.disabled = true;
                actionButton.style.backgroundColor = "#7f8c8d";
                return;
            }

            balanceDisplay.textContent = `$${balance}`;
            spinsDisplay.textContent = totalSpins;
            
            if (choiceWindowActive) {
                const standardCollectMode = !heldReels[1] && !heldReels[2] && !heldReels[3];
                
                if (standardCollectMode) {
                    if (balance + pendingPayout >= betCost) {
                        actionButton.textContent = pendingPayout > 0 ? `COLLECT & SPIN` : `SPIN ($${betCost})`;
                        actionButton.style.backgroundColor = "#e74c3c";
                    } else {
                        actionButton.textContent = `COLLECT ($${pendingPayout})`;
                        actionButton.style.backgroundColor = "#2ecc71";
                    }
                    actionButton.disabled = false; 
                } else {
                    actionButton.textContent = "RE-SPIN ($10)";
                    actionButton.style.backgroundColor = "#9b59b6";
                    actionButton.disabled = (balance < betCost);
                }
            } else {
                actionButton.textContent = `SPIN ($${betCost})`;
                actionButton.style.backgroundColor = "#e74c3c";
                actionButton.disabled = (balance < betCost);
            }

            if (actionButton.disabled) lever.classList.add('disabled');
            else lever.classList.remove('disabled');

            for (let i = 1; i <= 3; i++) {
                const wrapper = document.getElementById(`wrapper${i}`);
                if (canHold) wrapper.classList.add('selectable');
                else wrapper.classList.remove('selectable');
            }
        }

        function getRandomSymbol() {
            return symbols[Math.floor(Math.random() * symbols.length)];
        }

        function setScoreboardLoadingState() {
            Object.values(scoreboardPanels).forEach(panel => {
                panel.innerHTML = '<div class="scoreboard-empty">Loading scores...</div>';
            });
        }

        async function fetchScoreboardRows(kind) {
            if (kind == 'user') {
                const UUID = ensureUuid();
                const nickname = await dbGetNicknameForUUID(UUID);

                const { data, error, status } = await db
                    .from('scores_v1')
                    .select('score')
                    .eq('uuid', UUID)
                    .order('score', {ascending: false})
                    .limit(10);

                if (status !== 200 || error) {
                    console.error('Error querying scores:', error);
                    return [];
                }

                if (!data) {
                    console.log("No scores for", UUID);
                    return [];
                }

                let scores = [];

                for (d in data) {
                    scores.push({'nickname':nickname, 'score':data[d].score});
                }

                while (scores.length < 10) {
                    scores.push({'nickname':"", 'score':""});
                }

                return scores;
            } else if (kind == 'daily') {
                const todayDateString = new Date().toISOString().split('T')[0] + 'T00:00:00.000Z'

                const { data, error, status } = await db
                    .from('scores_v1')
                    .select('score, uuid')
                    .gte('created_at', todayDateString)
                    .order('score', {ascending: false})
                    .limit(10);

                if (status !== 200 || error) {
                    console.error('Error querying scores:', error);
                    return [];
                }

                if (!data) {
                    console.log("No scores for", UUID);
                    return [];
                }

                let scores = [];

                for (d in data) {
                    const nickname = await dbGetNicknameForUUID(data[d].uuid);
                    scores.push({'nickname':nickname, 'score':data[d].score});
                }
                
                while (scores.length < 10) {
                    scores.push({'nickname':"", 'score':""});
                }

                return scores;
            } else if (kind == 'alltime') {
                const { data, error, status } = await db
                    .from('scores_v1')
                    .select('score, uuid')
                    .order('score', {ascending: false})
                    .limit(10);

                if (status !== 200 || error) {
                    console.error('Error querying scores:', error);
                    return [];
                }

                if (!data) {
                    console.log("No scores for", UUID);
                    return [];
                }

                let scores = [];

                for (d in data) {
                    const nickname = await dbGetNicknameForUUID(data[d].uuid);
                    scores.push({'nickname':nickname, 'score':data[d].score});
                }
                
                while (scores.length < 10) {
                    scores.push({'nickname':"", 'score':""});
                }

                return scores;
            }

            return [];
        }

        async function refreshScoreboardData(runId) {
            const userRows = await fetchScoreboardRows('user');
            const dailyRows = await fetchScoreboardRows('daily');
            const alltimeRows = await fetchScoreboardRows('alltime');

            if (runId !== scoreboardRefreshToken || !scoreboardOverlay.classList.contains('active')) {
                return;
            }

            scoreboardData = {
                user: userRows,
                daily: dailyRows,
                alltime: alltimeRows
            };
            scoreboardDataLoaded = true;
            renderAllScoreboardPanels();
        }

        function renderAllScoreboardPanels() {
            Object.keys(scoreboardPanels).forEach(tab => renderScoreboardPanel(tab));
        }

        function openScoreboard() {
            scoreboardOverlay.classList.add('active');
            scoreboardDataLoaded = false;
            setScoreboardLoadingState();
            activeScoreboardTab = 'daily';
            scoreboardTabs.forEach(btn => btn.classList.toggle('active', btn.dataset.tab === activeScoreboardTab));
            Object.entries(scoreboardPanels).forEach(([key, panel]) => {
                panel.style.display = key === activeScoreboardTab ? 'block' : 'none';
            });

            const runId = ++scoreboardRefreshToken;
            refreshScoreboardData(runId);
        }

        function closeScoreboard(event) {
            if (event && event.target !== scoreboardOverlay) return;
            scoreboardRefreshToken += 1;
            scoreboardOverlay.classList.remove('active');
        }

        function switchScoreboardTab(tab) {
            activeScoreboardTab = tab;
            scoreboardTabs.forEach(btn => btn.classList.toggle('active', btn.dataset.tab === tab));
            Object.entries(scoreboardPanels).forEach(([key, panel]) => {
                panel.style.display = key === tab ? 'block' : 'none';
            });
            renderScoreboardPanel(tab);
        }

        function renderScoreboardPanel(tab) {
            const panel = scoreboardPanels[tab];
            const rows = scoreboardData[tab] || [];

            if (!scoreboardDataLoaded) {
                panel.innerHTML = '<div class="scoreboard-empty">Loading scores...</div>';
                return;
            }

            if (!rows.length) {
                panel.innerHTML = '<div class="scoreboard-empty">No scores yet.</div>';
                return;
            }

            panel.innerHTML = `
                <table class="scoreboard-table">
                    <thead>
                        <tr><th>Nickname</th><th>Score</th></tr>
                    </thead>
                    <tbody>
                        ${rows.map((row, index) => `<tr><td>${index + 1}. ${row.nickname}</td><td>${row.score}</td></tr>`).join('')}
                    </tbody>
                </table>
            `;
        }

        function toggleHold(reelIndex) {
            if (!canHold) return; 
            
            heldReels[reelIndex] = !heldReels[reelIndex];
            const wrapper = document.getElementById(`wrapper${reelIndex}`);
            
            if (heldReels[reelIndex]) {
                wrapper.classList.add('held');
            } else {
                wrapper.classList.remove('held');
            }
            updateUI();
        }

        function clearAllHolds() {
            canHold = false;
            for (let i = 1; i <= 3; i++) {
                heldReels[i] = false;
                document.getElementById(`wrapper${i}`).classList.remove('held');
            }
        }

        function handleLeverPull() {
            if (!actionButton.disabled) {
                handlePrimaryAction();
            }
        }

        function handlePrimaryAction() {
            if (choiceWindowActive) {
                const isAnyReelHeld = heldReels[1] || heldReels[2] || heldReels[3];
                if (isAnyReelHeld) {
                    optionalReSpin();
                } else {
                    collectAndSpinNext();
                }
            } else {
                initialSpin();
            }
        }

        function initialSpin() {
            if (balance < betCost) return;

            animateLever();
            balance -= betCost;
            totalSpins++; 
            clearAllHolds();
            choiceWindowActive = false;
            usedRespinThisRound = false; 
            updateUI();

            runSpinAnimation(() => {
                calculatePayoutState(false); 
                choiceWindowActive = true;
                canHold = true;
                updateUI();
                
                if (_force_triple === true) {
                    reel1.textContent = '🍊';
                    reel2.textContent = '🍊';
                    reel3.textContent = '🍊';
                    _force_triple = false;
                    updateUI();
                    console.log("forced");
                }
            });
        }

        function optionalReSpin() {
            if (balance < betCost) return;

            animateLever();
            balance -= betCost;
            totalSpins++;
            choiceWindowActive = false;
            canHold = false;
            usedRespinThisRound = true; 
            updateUI();

            runSpinAnimation(() => {
                calculatePayoutState(true); 
                concludeRound();
            });
        }

        function collectAndSpinNext() {
            balance += pendingPayout;
            recordHistoryStep();
            
            pendingPayout = 0;
            clearAllHolds();

            if (balance >= betCost) {
                initialSpin();
            } else {
                choiceWindowActive = false;
                updateUI();
                checkGameOver();
            }
        }

        function animateLever() {
            leverArm.classList.add('pulled');
            setTimeout(() => { leverArm.classList.remove('pulled'); }, 300);
        }

        function runSpinAnimation(callback) {
            actionButton.disabled = true;
            lever.classList.add('disabled');
            message.textContent = "Spinning...";
            message.style.color = "#fff";

            let count = 0;
            const interval = setInterval(() => {
                if (!heldReels[1]) reel1.textContent = getRandomSymbol();
                if (!heldReels[2]) reel2.textContent = getRandomSymbol();
                if (!heldReels[3]) reel3.textContent = getRandomSymbol();
                count++;

                if (count > 15) {
                    clearInterval(interval);
                    callback();
                }
            }, 100);
        }

        function calculatePayoutState(isRespinMode) {
            const r1 = reel1.textContent;
            const r2 = reel2.textContent;
            const r3 = reel3.textContent;

            const isThreeOfAKind = (r1 === r2 && r2 === r3);
            const moneyBagsCount = [r1, r2, r3].filter(sym => sym === '💰').length;
            
            if (isThreeOfAKind) {
                if (r1 === '💰') {
                    pendingPayout = 90;
                    message.textContent = `💰💰💰 TRIPLE BAGS! Value: $90!`;
                    message.style.color = "#2ecc71";
                } else {
                    pendingPayout = 30;
                    message.textContent = `${r1}${r2}${r3} TRIPLE MATCH! Value: $30!`;
                    message.style.color = "#3498db";
                }
            } else if (!isRespinMode && moneyBagsCount === 2) {
                pendingPayout = 10;
                message.textContent = `💰💰 2 Money Bags! Lock & RE-SPIN or claim $10 to continue.`;
                message.style.color = "#f1c40f";
            } else if (!isRespinMode && moneyBagsCount === 1) {
                pendingPayout = 5;
                message.textContent = `💰 1 Money Bag! Lock & RE-SPIN or claim $5.`;
                message.style.color = "#e67e22";
            } else {
                pendingPayout = 0;
                message.textContent = isRespinMode ? "❌ Strategy failed! Re-spin missed 3-of-a-kind ($0)." : "❌ Mixed roll ($0). Tap items to lock & RE-SPIN, or spin again to skip.";
                message.style.color = "#e74c3c";
            }
        }

        function concludeRound() {
            balance += pendingPayout;
            recordHistoryStep();
            
            pendingPayout = 0;
            choiceWindowActive = false;
            clearAllHolds();
            updateUI();
            checkGameOver();
        }

        function checkGameOver() {
            if (balance < betCost) {
                message.textContent = `💀 GAME OVER! Total Spins: ${totalSpins}. Share your score!`;
                actionButton.style.display = 'none';
                shareButton.style.display = 'block'; 
                handleGameOverCompletion();
                dbUploadScore();
            }
        }
        
        function hasNOccurrences(str, targets, n) {
            // 1. Create a Set of your 3 target characters for fast lookups
            const targetSet = new Set(targets);
            const counts = {};

            // 2. Count occurrences safely using for...of (handles Unicode correctly)
            for (const char of str) {
                if (targetSet.has(char)) {
                    counts[char] = (counts[char] || 0) + 1;
                }
            }

            // 3. Check if any of the target counts equal exactly n
            return Object.values(counts).some(count => count === n);
        }

        function recordHistoryStep() {
            const r1 = reel1.textContent;
            const r2 = reel2.textContent;
            const r3 = reel3.textContent;
            const won = pendingPayout > 0;
            const isSpecialWin = won && (
                hasNOccurrences(`${r1}${r2}${r3}`, symbols, 3) ||
                hasNOccurrences(`${r1}${r2}${r3}`, ['💰'], 2)
            );
            
            const blockColor = won ? "🟩 " : "⬛ ";
            const spinTypeTag = usedRespinThisRound ? "⟲" : "";
            const entry = isSpecialWin
                ? `${blockColor}[${r1}${r2}${r3}] ${spinTypeTag} `
                : `${blockColor}${spinTypeTag} `;

            if (isSpecialWin && historyGrid.length > 0 && !historyGrid[historyGrid.length - 1].endsWith('\n')) {
                historyGrid.push('\n');
            }

            historyGrid.push(entry);
            if (isSpecialWin) {
                historyGrid.push('\n');
            }
        }

        function copyShareHistory() {
            let shareText = getDailyShareText();

            if (!shareText) {
                let today_date = new Date();
                let dateString = today_date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                shareText = `🎰 Slotsdle (v1) Results | ${nickname} | ${dateString}\nSpins: ${totalSpins}\n`;

                shareText += historyGrid.join('');
                shareText += `\nPlay Slotsdle!\nhttps://skyhoffert.com/games/slotsdle/slotsdle_v1.html`;

                setDailyShareTextCookie(shareText);
            }

            navigator.clipboard.writeText(shareText).then(() => {
                const oldText = shareButton.textContent;
                shareButton.textContent = "Copied to Clipboard! ✓";
                shareButton.style.backgroundColor = "#3498db";
                setTimeout(() => {
                    shareButton.textContent = oldText;
                    shareButton.style.backgroundColor = "#2ecc71";
                }, 2000);
            }).catch(err => {
                alert("Failed to copy automatically. Copy this layout directly:\n\n" + shareText);
            });
        }



        // --- COOKIE HELPERS ---

        // Function to set a cookie that expires at midnight tonight
        function setDailyCompletionCookie() {
            const now = new Date();
            const midnight = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 0);
            const expires = "; expires=" + midnight.toUTCString();
            
            // Sets a cookie named "slotsdle_played_today"
            document.cookie = "slotsdle_played_today=true" + expires + "; path=/; SameSite=Strict";
        }

        function setDailyShareTextCookie(text) {
            const now = new Date();
            const midnight = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 0);
            const expires = "; expires=" + midnight.toUTCString();
            
            // Sets a cookie named "slotsdle_share_text"
            document.cookie = "slotsdle_share_text=" + encodeURIComponent(text) + expires + "; path=/; SameSite=Strict";
        }

        function getDailyShareText() {
            const match = document.cookie.match(/(?:^|; )slotsdle_share_text=([^;]*)/);
            return match ? decodeURIComponent(match[1]) : null;
        }

        // Function to check if our daily cookie exists
        function hasPlayedToday() {
            return document.cookie.split(';').some((item) => item.trim().startsWith('slotsdle_played_today='));
        }

        // Function to check or create unique ID.
        function getOrCreateDeviceID() {
            // Check if an ID already exists in localStorage
            let deviceID = localStorage.getItem('unique_device_id');

            if (!deviceID) {
                // Generate a cryptographically secure random UUID
                deviceID = crypto.randomUUID(); 
                localStorage.setItem('unique_device_id', deviceID);
            }

            return deviceID;
        }

        function ensureUuid() {
            if (!uuid) {
                uuid = getOrCreateDeviceID();
            }
            return uuid;
        }

        function generateRandomNickname() {
            const adjectives = ["Lucky", "Spinning", "Golden", "Jolly", "Swift", "Mighty", "Cheerful", "Witty", "Brave", "Clever", "Daring", "Fierce", "Nimble", "Sly", "Bold", "Quick", "Cunning", "Fearless", "Gallant", "Heroic", "Valiant", "Wise", "Zany", "Jovial", "Merry", "Perky", "Snappy", "Spry", "Waggish", "Whimsical"];
            const nouns = ["Player", "Spinner", "Gambler", "Slotter", "Champion", "Hero", "Ace", "Master", "Wizard", "Ninja", "Pirate", "Knight", "Rogue", "Samurai", "Viking", "Gladiator", "Adventurer", "Explorer", "Seeker", "Wanderer", "Nomad", "Maverick", "Trailblazer", "Pioneer", "Strategist", "Tactician", "Conqueror", "Defender", "Guardian"];
            const randomAdjective = adjectives[Math.floor(Math.random() * adjectives.length)];
            const randomNoun = nouns[Math.floor(Math.random() * nouns.length)];
            const randomNum = String(Math.floor(Math.random() * 99)).padStart(2,'0');
            return `${randomAdjective} ${randomNoun} ${randomNum}`;
        }

        function generateRecoveryKey() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            const array = new Uint8Array(8);
            window.crypto.getRandomValues(array);
            return Array.from(array, byte => chars[byte % chars.length]).join('');
        }

        
        // --- DATABASE HELPERS ----
        
        async function dbCheckForNickname() {
            const UUID = ensureUuid();

            const { data, error, status } = await db
                .from('players_v1')
                .select('nickname')
                .eq('uuid', UUID)
                .maybeSingle();

            if (status !== 200 || error) {
                console.error('Error querying:', error);
                return { found: null, error: true };
            }

            if (!data) {
                return { found: false, error: false };
            }

            return { found: true, error: false, player: data };
        }

        async function dbGetNicknameForUUID(given_uuid) {
            const { data, error, status } = await db
                .from('players_v1')
                .select('nickname')
                .eq('uuid', given_uuid)
                .maybeSingle();

            if (status !== 200 || error) {
                console.error('Error querying:', error);
                return null;
            }

            if (!data) {
                return null;
            }

            return data.nickname;
        }

        async function dbUpdateNickname(newNickname) {
            const UUID = ensureUuid();

            const { data, error, status } = await db
                .from('players_v1')
                .insert({ uuid: UUID, nickname: newNickname })
                .select()
                .maybeSingle();

            if (status !== 201 || error) {
                console.error('Error ', status, ' updating nickname:', error);
                return { success: false, error: true };
            }

            return { success: true, error: false, player: data };
        }

        async function dbUploadScore() {
            const UUID = ensureUuid();
            const { data, error, status } = await db
                .from('scores_v1')
                .insert({ uuid: UUID, score: totalSpins })
                .select()
                .maybeSingle();

            if (status !== 201 || error) {
                console.error('Error ', status, ' uploading score:', error);
                return false;
            }

            console.log("Uploaded score", totalSpins);
            return true;
        }


        // --- GAME INTEGRATION HOOKS ---

        // 1. Run this when your script loads / DOM is ready
        function checkGameStatusOnLoad() {
            if (hasPlayedToday()) {
                // Disable buttons, show message, or block interaction
                document.getElementById('action-button').disabled = true;
                hasPlayedTodayFlag = true;
                document.getElementById('message').textContent = "🔒 You've already played today! Come back tomorrow.";

                if (getDailyShareText()) {
                    document.getElementById('action-button').style.display = 'none';
                    document.getElementById('share-button').style.display = 'block';
                }
            }
            
            ensureUuid();
            console.log("Device ID:", uuid);
            //console.log("Nickname:", generateRandomNickname());
            //console.log("Recovery Key:", generateRecoveryKey());

            updateNicknameDisplay();

            dbCheckForNickname()
                .then(result => {
                    if (result?.found === true && result.player?.nickname) {
                        nickname = result.player.nickname;
                        console.log("Found player in db with nickname:", nickname);
                    } else if (result?.found === false) {
                        nickname = generateRandomNickname();
                        console.log("No player found in db. Generated nickname:", nickname);
                        dbUpdateNickname(nickname)
                            .then(updateResult => {
                                if (updateResult.success) {
                                    console.log("Successfully saved new nickname to db:", nickname);
                                } else {
                                    console.error("Failed to save new nickname to db.");
                                }
                            })
                            .catch(error => {
                                console.error("Error saving new nickname to db:", error);
                            });
                    } else {
                        nickname = null;
                        console.log("Database lookup error. Keeping placeholder nickname.");
                    }
                    updateNicknameDisplay();
                })
                .catch(error => {
                    console.error("Error checking player data:", error);
                    nickname = null;
                    updateNicknameDisplay();
                });
        }

        // 2. Call this inside your existing checkGameOver() function when they empty their wallet
        function handleGameOverCompletion() {
            setDailyCompletionCookie();
            document.getElementById('message').textContent = "💀 GAME OVER! Your results are locked in until tomorrow.";
        }


        // --- DEV STUFF ---

        // Secret dev reset: Click the version badge 5 times quickly to clear the daily lock
        let devClickCount = 0;
        let devClickTimer;

        document.querySelector('.version-badge').addEventListener('click', () => {
            devClickCount++;
            
            // Reset count if they stop tapping
            clearTimeout(devClickTimer);
            devClickTimer = setTimeout(() => { devClickCount = 0; }, 2000);

            // Trigger reset on the 5th quick tap
            if (devClickCount >= 5) {
                // Clear the cookie
                document.cookie = "slotsdle_played_today=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
                document.cookie = "slotsdle_share_text=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
                
                // Visual confirmation
                alert("🛠️ Dev Mode: Daily cookie reset! Reloading...");
                location.reload();
            }
        });

        function _SetUUID(uuidValue) {
            if (!uuidValue) {
                localStorage.removeItem('unique_device_id');
                console.log("Deleted existing UUID from localStorage.");
                return;
            }
            localStorage.setItem('unique_device_id', uuidValue);
            console.log("UUID manually set to:", uuidValue);
        }


        
        // --- MAIN ---
        
        document.addEventListener('DOMContentLoaded', (event) => {
            ensureUuid();
            checkGameStatusOnLoad();
            updateUI();
        });



    </script>
