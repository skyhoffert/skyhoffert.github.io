<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gambdle (v1)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c3e50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px 10px;
            box-sizing: border-box;
            color: #fff;
            user-select: none;
            -webkit-user-select: none;
        }

        h1 {
            margin-top: 10px;
            margin-bottom: 0px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            font-size: 2.2rem;
            letter-spacing: 2px;
        }

        .version-badge {
            font-size: 0.8rem;
            opacity: 0.6;
            margin-bottom: 5px;
            font-weight: bold;
            background: rgba(0,0,0,0.3);
            padding: 2px 8px;
            border-radius: 20px;
        }

        .tagline {
            font-size: 1rem;
            font-style: italic;
            opacity: 0.85;
            margin-bottom: 15px;
            text-align: center;
            max-width: 280px;
            line-height: 1.2;
            color: #ecf0f1;
        }

        .stats-container {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            font-size: 1.1rem;
            background: rgba(0,0,0,0.2);
            padding: 8px 16px;
            border-radius: 10px;
        }

        .stat-box span {
            font-weight: bold;
            color: #2ecc71;
        }

        .game-wrapper {
            display: flex;
            align-items: center;
            position: relative;
            max-width: 100%;
        }

        .machine-container {
            background-color: #f1c40f;
            border: 6px solid #d35400;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            width: 300px;
            max-width: 100%;
            z-index: 2;
            box-sizing: border-box;
        }

        /* --- LEVER MECHANISM --- */
        .lever-container {
            width: 40px;
            height: 160px;
            position: relative;
            cursor: pointer;
            z-index: 1;
            margin-left: -4px;
        }

        .lever-base {
            width: 20px;
            height: 40px;
            background: #7f8c8d;
            border: 3px solid #34495e;
            border-left: none;
            position: absolute;
            top: 70px;
            left: 0;
            border-radius: 0 5px 5px 0;
        }

        .lever-arm {
            width: 12px;
            height: 80px;
            background: linear-gradient(to right, #bdc3c7, #95a5a6);
            border: 2px solid #34495e;
            position: absolute;
            bottom: 85px;
            left: 8px;
            transform-origin: bottom center;
            transition: transform 0.2s ease-in-out;
            border-radius: 4px;
        }

        .lever-knob {
            width: 30px;
            height: 30px;
            background: #e74c3c;
            border-radius: 50%;
            border: 2px solid #c0392b;
            position: absolute;
            top: -25px;
            left: -11px;
            box-shadow: inset -3px -3px 5px rgba(0,0,0,0.3);
        }

        .lever-arm.pulled {
            transform: rotateX(180deg) translateY(-50px);
        }

        .lever-container.disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .slots {
            display: flex;
            justify-content: center;
            background-color: #34495e;
            padding: 15px 10px;
            border-radius: 10px;
            border: 4px solid #2c3e50;
            margin-bottom: 20px;
        }

        .reel-wrapper {
            position: relative;
            margin: 0 5px;
            flex: 1;
            max-width: 75px;
        }

        .reel {
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: #fff;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
            cursor: default;
            transition: border 0.2s;
            box-sizing: border-box;
        }

        .reel-wrapper.selectable .reel {
            cursor: pointer;
            border: 3px dashed #f1c40f;
        }
        
        .reel-wrapper.selectable .reel:hover {
            background-color: #f5f6fa;
        }

        .lock-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(46, 204, 113, 0.4);
            border: 3px solid #2ecc71;
            border-radius: 10px;
            box-sizing: border-box;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 1px 1px 2px #000;
            pointer-events: none;
        }

        .reel-wrapper.held .lock-overlay {
            display: flex;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            width: 100%;
        }

        .spin-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px #c0392b;
            transition: all 0.1s ease;
            width: 100%;
            box-sizing: border-box;
        }

        .spin-btn:active:not(:disabled) {
            box-shadow: 0 1px #c0392b;
            transform: translateY(4px);
        }

        .share-btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px #27ae60;
            display: none;
            transition: all 0.1s ease;
            width: 100%;
            box-sizing: border-box;
        }

        .share-btn:active {
            box-shadow: 0 1px #27ae60;
            transform: translateY(3px);
        }

        button:disabled {
            background-color: #bdc3c7 !important;
            box-shadow: none !important;
            cursor: not-allowed;
            transform: none !important;
        }

        #message {
            margin-top: 15px;
            font-size: 1rem;
            font-weight: bold;
            min-height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
            padding: 0 5px;
            line-height: 1.3;
        }

        /* --- RESPONSIVE MOBILE OVERRIDES --- */
        @media (max-width: 400px) {
            .game-wrapper {
                flex-direction: column;
                align-items: center;
                gap: 10px;
                width: 100%;
            }
            .lever-container {
                transform: rotate(-90deg);
                height: 100px;
                margin-left: 0;
                margin-top: -10px;
            }
            .machine-container {
                width: 100%;
            }
            .reel {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>

    <h1>Gambdle</h1>
    <div class="version-badge">v1</div>
    <div class="tagline">How long can you keep spinning?</div>

    <div class="stats-container">
        <div class="stat-box">Balance: <span id="balance">$50</span></div>
        <div class="stat-box">Spins: <span id="spins-count" style="color: #3498db;">0</span></div>
    </div>

    <div class="game-wrapper">
        <div class="machine-container">
            <div class="slots">
                <div id="wrapper1" class="reel-wrapper" onclick="toggleHold(1)">
                    <div id="reel1" class="reel">🍒</div>
                    <div class="lock-overlay">HELD</div>
                </div>
                <div id="wrapper2" class="reel-wrapper" onclick="toggleHold(2)">
                    <div id="reel2" class="reel">🍋</div>
                    <div class="lock-overlay">HELD</div>
                </div>
                <div id="wrapper3" class="reel-wrapper" onclick="toggleHold(3)">
                    <div id="reel3" class="reel">🍊</div>
                    <div class="lock-overlay">HELD</div>
                </div>
            </div>

            <div class="btn-group">
                <button id="action-button" class="spin-btn" onclick="handlePrimaryAction()">SPIN ($10)</button>
                <button id="share-button" class="share-btn" onclick="copyShareHistory()">Copy Gambdle Grid 📋</button>
            </div>

            <div id="message">Pull the lever or click spin to start!</div>
        </div>

        <div id="lever" class="lever-container" onclick="handleLeverPull()">
            <div class="lever-base"></div>
            <div id="lever-arm" class="lever-arm">
                <div class="lever-knob"></div>
            </div>
        </div>
    </div>

    <script>
        const symbols = ['🍒', '🍋', '🍊', '💰'];
        
        let balance = 50;
        let totalSpins = 0;
        const betCost = 10;
        
        let canHold = false;
        let choiceWindowActive = false;
        let heldReels = { 1: false, 2: false, 3: false };
        let pendingPayout = 0;
        let usedRespinThisRound = false; 
        let historyGrid = []; 

        const reel1 = document.getElementById('reel1');
        const reel2 = document.getElementById('reel2');
        const reel3 = document.getElementById('reel3');
        const actionButton = document.getElementById('action-button');
        const shareButton = document.getElementById('share-button');
        const balanceDisplay = document.getElementById('balance');
        const spinsDisplay = document.getElementById('spins-count');
        const message = document.getElementById('message');
        const lever = document.getElementById('lever');
        const leverArm = document.getElementById('lever-arm');

        function updateUI() {
            balanceDisplay.textContent = `$${balance}`;
            spinsDisplay.textContent = totalSpins;
            
            if (choiceWindowActive) {
                const standardCollectMode = !heldReels[1] && !heldReels[2] && !heldReels[3];
                
                if (standardCollectMode) {
                    // Check if they actually have enough combined funds to play a subsequent round
                    if (balance + pendingPayout >= betCost) {
                        actionButton.textContent = pendingPayout > 0 ? `COLLECT & SPIN` : `SPIN ($${betCost})`;
                        actionButton.style.backgroundColor = "#e74c3c";
                    } else {
                        // Safe routing branch: forced cash out when bankrupt next turn
                        actionButton.textContent = `COLLECT ($${pendingPayout})`;
                        actionButton.style.backgroundColor = "#2ecc71";
                    }
                    actionButton.disabled = false; 
                } else {
                    actionButton.textContent = "RE-SPIN ($10)";
                    actionButton.style.backgroundColor = "#9b59b6";
                    actionButton.disabled = (balance < betCost);
                }
            } else {
                actionButton.textContent = `SPIN ($${betCost})`;
                actionButton.style.backgroundColor = "#e74c3c";
                actionButton.disabled = (balance < betCost);
            }

            if (actionButton.disabled) lever.classList.add('disabled');
            else lever.classList.remove('disabled');

            for (let i = 1; i <= 3; i++) {
                const wrapper = document.getElementById(`wrapper${i}`);
                if (canHold) wrapper.classList.add('selectable');
                else wrapper.classList.remove('selectable');
            }
        }

        function getRandomSymbol() {
            return symbols[Math.floor(Math.random() * symbols.length)];
        }

        function toggleHold(reelIndex) {
            if (!canHold) return; 
            
            heldReels[reelIndex] = !heldReels[reelIndex];
            const wrapper = document.getElementById(`wrapper${reelIndex}`);
            
            if (heldReels[reelIndex]) {
                wrapper.classList.add('held');
            } else {
                wrapper.classList.remove('held');
            }
            updateUI();
        }

        function clearAllHolds() {
            canHold = false;
            for (let i = 1; i <= 3; i++) {
                heldReels[i] = false;
                document.getElementById(`wrapper${i}`).classList.remove('held');
            }
        }

        function handleLeverPull() {
            if (!actionButton.disabled) {
                handlePrimaryAction();
            }
        }

        function handlePrimaryAction() {
            if (choiceWindowActive) {
                const isAnyReelHeld = heldReels[1] || heldReels[2] || heldReels[3];
                if (isAnyReelHeld) {
                    optionalReSpin();
                } else {
                    collectAndSpinNext();
                }
            } else {
                initialSpin();
            }
        }

        function initialSpin() {
            if (balance < betCost) return;

            animateLever();
            balance -= betCost;
            totalSpins++; 
            clearAllHolds();
            choiceWindowActive = false;
            usedRespinThisRound = false; 
            updateUI();

            runSpinAnimation(() => {
                calculatePayoutState(false); 
                choiceWindowActive = true;
                canHold = true;
                updateUI();
            });
        }

        function optionalReSpin() {
            if (balance < betCost) return;

            animateLever();
            balance -= betCost;
            totalSpins++;
            choiceWindowActive = false;
            canHold = false;
            usedRespinThisRound = true; 
            updateUI();

            runSpinAnimation(() => {
                calculatePayoutState(true); 
                concludeRound();
            });
        }

        function collectAndSpinNext() {
            balance += pendingPayout;
            recordHistoryStep();
            
            pendingPayout = 0;
            clearAllHolds();

            if (balance >= betCost) {
                initialSpin();
            } else {
                choiceWindowActive = false;
                updateUI();
                checkGameOver();
            }
        }

        function animateLever() {
            leverArm.classList.add('pulled');
            setTimeout(() => { leverArm.classList.remove('pulled'); }, 300);
        }

        function runSpinAnimation(callback) {
            actionButton.disabled = true;
            lever.classList.add('disabled');
            message.textContent = "Spinning...";
            message.style.color = "#fff";

            let count = 0;
            const interval = setInterval(() => {
                if (!heldReels[1]) reel1.textContent = getRandomSymbol();
                if (!heldReels[2]) reel2.textContent = getRandomSymbol();
                if (!heldReels[3]) reel3.textContent = getRandomSymbol();
                count++;

                if (count > 15) {
                    clearInterval(interval);
                    callback();
                }
            }, 100);
        }

        function calculatePayoutState(isRespinMode) {
            const r1 = reel1.textContent;
            const r2 = reel2.textContent;
            const r3 = reel3.textContent;

            const isThreeOfAKind = (r1 === r2 && r2 === r3);
            const moneyBagsCount = [r1, r2, r3].filter(sym => sym === '💰').length;
            
            if (isThreeOfAKind) {
                if (r1 === '💰') {
                    pendingPayout = 90;
                    message.textContent = `💰💰💰 TRIPLE BAGS! Value: $90!`;
                    message.style.color = "#2ecc71";
                } else {
                    pendingPayout = 30;
                    message.textContent = `${r1}${r2}${r3} TRIPLE MATCH! Value: $30!`;
                    message.style.color = "#3498db";
                }
            } else if (!isRespinMode && moneyBagsCount === 2) {
                pendingPayout = 10;
                message.textContent = `💰💰 2 Money Bags! Lock & RE-SPIN or claim $10 to continue.`;
                message.style.color = "#f1c40f";
            } else if (!isRespinMode && moneyBagsCount === 1) {
                pendingPayout = 5;
                message.textContent = `💰 1 Money Bag! Lock & RE-SPIN or claim $5.`;
                message.style.color = "#e67e22";
            } else {
                pendingPayout = 0;
                message.textContent = isRespinMode ? "❌ Strategy failed! Re-spin missed 3-of-a-kind ($0)." : "❌ Mixed roll ($0). Tap items to lock & RE-SPIN, or spin again to skip.";
                message.style.color = "#e74c3c";
            }
        }

        function concludeRound() {
            balance += pendingPayout;
            recordHistoryStep();
            
            pendingPayout = 0;
            choiceWindowActive = false;
            clearAllHolds();
            updateUI();
            checkGameOver();
        }

        function checkGameOver() {
            if (balance < betCost) {
                message.textContent = `💀 GAME OVER! Total Spins: ${totalSpins}. Share your score!`;
                actionButton.style.display = 'none';
                shareButton.style.display = 'block'; 
            }
        }

        function recordHistoryStep() {
            const r1 = reel1.textContent;
            const r2 = reel2.textContent;
            const r3 = reel3.textContent;
            const won = pendingPayout > 0;
            
            let blockColor = won ? "🟩" : "⬛";
            let spinTypeTag = usedRespinThisRound ? "(Re-Spin)" : "(Initial)";
            
            historyGrid.push(`${blockColor} [${r1}${r2}${r3}] ${spinTypeTag}`);
        }

        function copyShareHistory() {
            let shareText = `🎰 Gambdle (v1) Result Grid 🎰\nTotal Spins: ${totalSpins}\n\n`;
            shareText += historyGrid.join("\n");
            shareText += `\n\nPlay Gambdle!`;

            navigator.clipboard.writeText(shareText).then(() => {
                const oldText = shareButton.textContent;
                shareButton.textContent = "Copied to Clipboard! ✓";
                shareButton.style.backgroundColor = "#3498db";
                setTimeout(() => {
                    shareButton.textContent = oldText;
                    shareButton.style.backgroundColor = "#2ecc71";
                }, 2000);
            }).catch(err => {
                alert("Failed to copy automatically. Copy this layout directly:\n\n" + shareText);
            });
        }
    </script>
</body>
</html>
